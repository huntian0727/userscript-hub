name: Build and deploy Userscript Hub

on:
  push:
    branches: [main]
    paths:
      - 'registry.json'
      - 'userscripts/**'
      - 'history/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Build static site and verify committed history
        env:
          PAGES_BASE_URL: https://huntian0727.github.io/userscript-hub
        run: node scripts/build-pages.js --check-history

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: https://huntian0727.github.io/userscript-hub/
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
