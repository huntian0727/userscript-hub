name: Build and deploy Userscript Hub

on:
  push:
    branches: [main]
    paths:
      - 'registry.json'
      - 'userscripts/**'
      - 'history/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Build static site and verify committed history
        env:
          PAGES_BASE_URL: https://huntian0727.github.io/userscript-hub
        run: node scripts/build-pages.js --check-history

      - name: Package Pages artifact
        run: |
          tar --dereference --hard-dereference --exclude='.[^/]*' \
            --directory site --create --file "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 9

  deploy:
    environment:
      name: github-pages
      url: https://huntian0727.github.io/userscript-hub/
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

